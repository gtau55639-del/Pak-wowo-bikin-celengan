name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip
        run: unzip -o SAKUTABUNG-v2_8_0.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x v28/gradlew

      - name: Build debug APK
        working-directory: v28
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sakutabung-debug-apk
          path: v28/app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        working-directory: v28
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sakutabung-release-apk
          path: v28/app/build/outputs/apk/release/*.apk
