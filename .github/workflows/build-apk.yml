name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in the repo root. Make sure the project zip is uploaded at the top level of the repo."
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate project root
        id: locate
        run: |
          set -e
          PROJECT_DIR=$(find extracted -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -maxdepth 3 -name "settings.gradle" -exec dirname {} \; | head -n 1)
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle(.kts) inside the extracted zip."
            find extracted -maxdepth 3
            exit 1
          fi
          echo "Project root: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
